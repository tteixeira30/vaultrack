spring:
  application:
    name: tracky
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tracky}
    username: ${SPRING_DATASOURCE_USERNAME:tracky}
    password: ${SPRING_DATASOURCE_PASSWORD:tracky}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # Dialeto explícito: o Hibernate não precisa de abrir uma ligação JDBC
        # só para o descobrir no arranque. Evita o crash "Unable to determine
        # Dialect without JDBC metadata" quando a DB está momentaneamente
        # indisponível (deploys, reinícios). Ver docker-entrypoint.sh (wait-for-db).
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  # Atrás do Caddy: o IP real do cliente vem do X-Forwarded-For (só aceite de
  # proxies em redes internas, regra por omissão do Tomcat). Sem isto, todos os
  # pedidos pareceriam vir do proxy e o limite por IP seria partilhado.
  forward-headers-strategy: native
  error:
    include-message: always

tracky:
  jwt-secret: ${JWT_SECRET:tracky-dev-secret-nao-usar-em-producao-0123456789abcdef}
  invite-code: ${TRACKY_INVITE_CODE:}
  # Origens CORS permitidas (lista separada por vírgulas). Em produção definir
  # TRACKY_CORS_ORIGINS com o domínio do frontend + origens da app mobile
  # (Capacitor): http://localhost e https://localhost (Android), capacitor://localhost (iOS).
  # Dias que os eventos de auditoria ficam guardados (0 = não apagar). Os IPs são dados pessoais.
  audit:
    retention-days: ${TRACKY_AUDIT_RETENTION_DAYS:365}
  cors-origins: ${TRACKY_CORS_ORIGINS:*,http://localhost,https://localhost,capacitor://localhost}
  # Limite de tentativas no login/registo (em memória, por instância). Defaults
  # estritos = produção; em dev/E2E (muitos registos do mesmo IP) desliga-se
  # com TRACKY_RATE_LIMIT_ENABLED=false.
  rate-limit:
    enabled: ${TRACKY_RATE_LIMIT_ENABLED:true}
    login-per-ip: ${TRACKY_RATE_LIMIT_LOGIN_PER_IP:20}                         # pedidos / 15 min
    login-failures-per-email: ${TRACKY_RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:5}  # falhas / 15 min
    register-per-ip: ${TRACKY_RATE_LIMIT_REGISTER_PER_IP:5}                    # pedidos / hora
