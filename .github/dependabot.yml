# Atualizações automáticas de dependências — PRs semanais com limites
# para evitar uma inundação inicial.
#
# Os updates vêm agrupados. Sem grupos, o dependabot abre um PR por
# dependência e todos mexem no mesmo package-lock.json: mergeado o primeiro,
# os restantes ficam em conflito e cada um precisa de um rebase e de uma volta
# inteira de CI. Aconteceu com cinco PRs de dev-dependencies do frontend.
#
# Dev e produção ficam em grupos separados de propósito: o ruído das
# ferramentas (eslint, tipos, testes) não deve arrastar consigo uma
# dependência que vai parar ao bundle sem alguém reparar.
#
# Os grupos levam só `minor` e `patch`. Um major dentro de um grupo leva o
# lote inteiro com ele: o grupo e2e-dev subiu o TypeScript de 5.7 para 7.0 e
# o `npm ci` passou a rebentar com ERESOLVE, porque o typescript-eslint exige
# `typescript >=4.8.4 <6.1.0`. Os quatro updates saudáveis do mesmo PR ficaram
# reféns de um. Fora dos grupos, cada major vem no seu PR, é revisto à mão e
# não entra pelo auto-merge (que só aceita minor e patch).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dev:
        dependency-type: development
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      frontend-prod:
        dependency-type: production
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      e2e-dev:
        dependency-type: development
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      e2e-prod:
        dependency-type: production
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker-backend:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      docker-frontend:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
