server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve .mjs como JavaScript. Versões antigas do nginx não mapeiam .mjs no
    # mime.types e serviam-no como application/octet-stream — o browser recusa
    # então o web worker (módulo) do pdf.js e o import de extratos PDF rebenta
    # com "Erro ao ler". default_type só se aplica quando a extensão não tem
    # mapeamento, pelo que é inofensivo em nginx recentes (que já mapeiam .mjs).
    # As localizações regex ganham às de prefixo, por isso o try_files tem de
    # ser repetido aqui — senão os .mjs voltavam a cair no index.html.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Ficheiros com hash no nome: se não existirem, é 404 — nunca o index.html.
    # O try_files do SPA (abaixo) respondia 200 com a página inteira a um pedido
    # de /assets/*.js, e o browser recebia HTML onde esperava um módulo. Quem
    # dava por isso era a importação de extratos em PDF, o único sítio que carrega
    # um chunk por import() dinâmico: bastava reconstruir o frontend com uma
    # página já aberta (os nomes mudam de hash) para o parser deixar de existir
    # e a importação morrer em "Erro ao ler", como se o PDF é que estivesse mal.
    location /assets/ {
        try_files $uri =404;
    }

    # O index.html e o service worker são os únicos ficheiros sem hash no nome:
    # são eles que apontam para a versão atual dos restantes. Em cache ficariam
    # a pedir chunks que já não existem, mesmo depois de recarregar a página.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
