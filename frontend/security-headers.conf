# Headers de segurança comuns a todas as respostas do nginx.
# Ficheiro à parte porque o add_header só é herdado por um location que não
# declare nenhum add_header seu: os locations com Cache-Control (index.html,
# sw.js) têm de o incluir outra vez, senão perdiam estes headers em silêncio.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# App privada: nada para indexar (o robots.txt e o <meta robots> dizem o mesmo).
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP em modo Report-Only: o browser só regista as violações na consola (a
# fixture dos E2E falha com elas) sem bloquear nada. Passar a
# Content-Security-Policy quando produção estiver um tempo sem violações.
# O sha256 é o do script inline do tema no index.html — se esse script mudar,
# o hash tem de ser recalculado (ver o comentário no próprio index.html).
# A app Capacitor não passa por aqui: o bundle é servido localmente pela WebView.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-fXsHAHjttZXKe6WCxCXm8CYDpSVDHvZbTWQtP2pX1ik='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
