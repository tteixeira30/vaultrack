<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Cor da barra do sistema (coerente com --bg do tema escuro em styles.css) -->
    <meta name="theme-color" content="#0a0b10" />
    <!-- Modo app quando adicionada ao ecrã inicial no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Vaultrack: finanças pessoais num só sítio. Rendimento, investimentos, objetivos e movimentos." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Vaultrack</title>
    <!-- A CSP (frontend/security-headers.conf) autoriza este script pelo seu sha256:
         qualquer alteração ao conteúdo dele obriga a recalcular esse hash. -->
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash ao carregar.
      (function () {
        try {
          var saved = localStorage.getItem('tracky_theme');
          var system = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          document.documentElement.dataset.theme = (saved === 'light' || saved === 'dark') ? saved : system;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
